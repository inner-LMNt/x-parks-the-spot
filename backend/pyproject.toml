[tool.poetry]
name = "xpark"
version = "0.0.0"
description = "xpark backend"
authors = ["Ersei Saggi <vcs@ersei.net>"]
license = "Proprietary"
include = [{path = "migrations", format = "sdist"}]

[pytest]
pythonpath = "xpark"

[tool.mypy]
files = ["xpark"]

[tool.coverage.run]
source = ["xpark"]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
src = ["xpark"]

[tool.ruff.lint]
ignore = ["E402"] # Imports do not have to be at the top of the file

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.12"
argon2-cffi = "23.1.0"
argon2-cffi-bindings = "21.2.0"
blinker = "1.8.2"
cffi = "1.17.1"
click = "8.1.7"
coverage = "7.6.1"
cryptography = "43.0.1"
flask = "3.0.3"
iniconfig = "2.0.0"
itsdangerous = "2.2.0"
jinja2 = "3.1.4"
markupsafe = "2.1.5"
mypy = "1.11.2"
mypy-extensions = "1.0.0"
packaging = "24.1"
pathspec = "0.12.1"
platformdirs = "4.3.6"
pluggy = "1.5.0"
psycopg = "3.2.2"
psycopg-c = "3.2.2"
psycopg-pool = "3.2.3"
pycparser = "2.22"
pytest = "8.3.3"
python-dotenv = "1.0.1"
redis = "4.6.0"
result = "0.17.0"
types-cffi = "1.16.0.20240331"
types-pyopenssl = "24.1.0.20240722"
types-redis = "4.6.0.20240903"
types-setuptools = "75.1.0.20240917"
typing-extensions = "4.12.2"
werkzeug = "3.0.4"
wrapt = "1.16.0"
pip = "^24.2"
ruff = "^0.6.8"
