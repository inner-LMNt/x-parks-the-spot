type: object
properties:
  id:
    type: string
    format: uuid
  spot_finder_id:
    type: string
    format: uuid
  location:
    $ref: './Location.yaml'
  photo_url:
    type: string
    format: uri
  time:
    type: string
    format: date-time
  status:
    type: string
    enum:
      - verified
      - pending
      - rejected
  points_awarded:
    type: integer
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
