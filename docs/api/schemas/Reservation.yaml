type: object
required:
  - id
  - parking_space_id
  - name
  - renter_id
  - owner_id
  - start_time
  - end_time
  - status
  - car_info_id
  - created_at
  - updated_at
  - price
properties:
  id:
    type: string
    format: uuid
  parking_space_id:
    type: string
    format: uuid
  name:
    type: string
    format: uuid
  renter_id:
    type: string
    format: uuid
  owner_id:
    type: string
    format: uuid
  start_time:
    type: string
    format: date-time
  end_time:
    type: string
    format: date-time
  status:
    type: string
    enum:
      - booked
      - active
      - completed
      - canceled
  car_info_id:
    type: string
    format: uuid
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  price:
    type: number
