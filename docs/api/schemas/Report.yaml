type: object
required:
  - id
  - type
  - description
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier for the report.

  user_id:
    type: string
    format: uuid
    description: Unique identifier of the user who created the report.

  reservation_id:
    type: string
    format: uuid
    description: Unique identifier of the reservation associated with this report.
    nullable: true

  parking_space_id:
    type: string
    format: uuid
    description: Unique identifier of the parking space involved in the reservation.
    nullable: true

  parking_space_name:
    type: string
    description: Name of the parking space.
    nullable: true

  parking_space_address:
    type: string
    description: Address of the parking space.
    nullable: true

  owner_name:
    type: string
    description: Name of the owner of the parking space.
    nullable: true

  start_time:
    type: string
    format: date-time
    description: Start time of the reservation.
    nullable: true

  end_time:
    type: string
    format: date-time
    description: End time of the reservation.
    nullable: true

  type:
    type: string
    enum:
      - Reservation Issue
      - Renter Overstay
      - Damage Report
      - Other
    description: Type of the report.

  description:
    type: string
    description: Detailed description of the issue.

  status:
    type: string
    enum:
      - open
      - in_progress
      - resolved
    description: Current status of the report.

  admin_response:
    type: string
    nullable: true
    description: Response from the admin regarding the report.

  created_at:
    type: string
    format: date-time
    description: Timestamp when the report was created.

  updated_at:
    type: string
    format: date-time
    description: Timestamp when the report was last updated.

  departure_time:
    type: string
    format: date-time
    description: Actual departure time of the renter (for Renter Overstay reports).
    nullable: true

  overstay_duration:
    type: integer
    description: Duration of the overstay in minutes (for Renter Overstay reports).
    nullable: true

  damage_type:
    type: string
    description: Type of damage reported (for Damage Report).
    nullable: true

  damage_severity:
    type: string
    description: Severity of the damage (for Damage Report).
    nullable: true

  image_url:
    type: string
    description: URL of the image associated with the report.
    nullable: true