openapi: 3.0.0
info:
  title: Parking Space Sharing API
  version: unstable
  description: API specification for the parking space sharing application.
servers:
  - url: https://xpark-staging.ersei.net/api/unstable
    description: Staging Server
tags:
  - name: Authentication
    description: User authentication and account management
  - name: Users
    description: User profiles and preferences
  - name: Parking Spaces
    description: Parking space listings and management
  - name: Reservations
    description: Booking and managing reservations
  - name: Spot Finder
    description: Spot finder submissions and rewards
  - name: Notifications
    description: User notifications
  - name: Admin
    description: Administrative actions
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/RegisterRequest.yaml'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: './schemas/AuthResponse.yaml'
        '400':
          description: Invalid input
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/LoginRequest.yaml'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: './schemas/AuthResponse.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /auth/password-reset:
    post:
      tags:
        - Authentication
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/PasswordResetRequest.yaml'
      responses:
        '200':
          description: Password reset email sent
  /auth/password-reset/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/PasswordResetConfirmRequest.yaml'
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid password
        '401':
          description: No token given
        '403':
          description: Incorrect token given
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: './schemas/User.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    put:
      tags:
        - Users
      summary: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/UserUpdateRequest.yaml'
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: './schemas/User.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      tags:
        - Users
      summary: Delete current user's account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Email sent to confirm deletion
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /users/me/confirm-deletion:
    post:
      tags:
        - Users
      summary: Confirm deletion of account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/UserDeletionConfirm.yaml'
      responses:
        '200':
          description: "User deleted"
  /cars:
    get:
      tags:
        - Cars
      summary: Get current user's car information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of car information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/CarInfoList.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
        - Cars
      summary: Add new car
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/CarInfo.yaml'
      responses:
        '201':
          description: Car information added
          content:
            application/json:
              schema:
                $ref: './schemas/CarInfo.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /cars/{id}:
    patch:
      tags:
        - Cars
      summary: Update a car's information
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Car updated
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Car not found
    delete:
      tags:
        - Cars
      summary: Delete a car
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Car deleted
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Car not found
  /parking-spaces:
    post:
      tags:
        - Parking Spaces
      summary: Create a new parking space
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/ParkingSpaceCreateRequest.yaml'
      responses:
        '201':
          description: Parking space created
          content:
            application/json:
              schema:
                $ref: './schemas/ParkingSpace.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /parking-spaces/search:
    post:
      tags:
        - Parking Spaces
      summary: Search for parking spaces
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            format: float
        - in: query
          name: longitude
          required: true
          schema:
            type: number
            format: float
        - in: query
          name: radius
          schema:
            type: number
            format: float
            default: 5
        - in: query
          name: available_from
          schema:
            type: string
            format: date-time
        - in: query
          name: available_to
          schema:
            type: string
            format: date-time
        - in: query
          name: free_only
          schema:
            type: boolean
            default: false
        - in: query
          name: features
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: List of parking spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/ParkingSpaceSummary.yaml'
  /parking-spaces/{id}:
    get:
      tags:
        - Parking Spaces
      summary: Get parking space details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Parking space details
          content:
            application/json:
              schema:
                $ref: './schemas/ParkingSpace.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      tags:
        - Parking Spaces
      summary: Update parking space
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/ParkingSpaceUpdateRequest.yaml'
      responses:
        '200':
          description: Parking space updated
          content:
            application/json:
              schema:
                $ref: './schemas/ParkingSpace.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Parking space not found
    delete:
      tags:
        - Parking Spaces
      summary: Delete parking space
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Parking space deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Parking space not found
  /reservations:
    get:
      tags:
        - Reservations
      summary: Get current user's reservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/Reservation.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
        - Reservations
      summary: Create a new reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/ReservationCreateRequest.yaml'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: './schemas/Reservation.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /reservations/{id}:
    get:
      tags:
        - Reservations
      summary: Get reservation details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: './schemas/Reservation.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags:
        - Reservations
      summary: Update reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/ReservationUpdateRequest.yaml'
      responses:
        '200':
          description: Reservation updated
          content:
            application/json:
              schema:
                $ref: './schemas/Reservation.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      tags:
        - Reservations
      summary: Cancel reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation canceled
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /reservations/lock:
    post:
      tags:
        - Reservations
      summary: Lock a parking space by Parking Space ID
      description: |
        Locks a specified parking space for the authenticated user. The user ID is extracted from the authentication token.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - parking_space_id
                - lock_duration
              properties:
                parking_space_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the parking space to lock.
                lock_duration:
                  type: string
                  format: duration
                  description: Duration for which the parking space should be locked (e.g., "PT15M" for 15 minutes).
      responses:
        '200':
          description: Parking space locked successfully.
        '400':
          description: Invalid input data.
        '401':
          description: Unauthorized. Authentication token is missing or invalid.
        '403':
          description: Forbidden. User does not have permission to lock this parking space.
        '409':
          description: Conflict. Parking space is already locked or reserved.
  /reservations/unlock:
    post:
      tags:
        - Reservations
      summary: Unlock a previously locked parking space
      description: |
        Unlocks a specified parking space that was previously locked by the authenticated user. The user ID is extracted from the authentication token.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - parking_space_id
              properties:
                parking_space_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the parking space to unlock.
      responses:
        '200':
          description: Parking space unlocked successfully.
        '400':
          description: Invalid input data.
        '401':
          description: Unauthorized. Authentication token is missing or invalid.
        '403':
          description: Forbidden. User does not have permission to unlock this parking space.
        '404':
          description: Not Found. The parking space is not currently locked by the user.

  /spot-finder/submissions:
    get:
      tags:
        - Spot Finder
      summary: Get user's spot submissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/SpotFinderSubmission.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
        - Spot Finder
      summary: Submit a new spot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                latitude:
                  type: number
                  format: float
                longitude:
                  type: number
                  format: float
      responses:
        '201':
          description: Spot submitted
          content:
            application/json:
              schema:
                $ref: './schemas/SpotFinderSubmission.yaml'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /notifications:
    get:
      tags:
        - Notifications
      summary: Get user's notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/Notification.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /notifications/{id}/read:
    post:
      tags:
        - Notifications
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /admin/users:
    get:
      tags:
        - Admin
      summary: Get list of users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum:
              - renter
              - owner
              - spot_finder
              - admin
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/PublicUserProfile.yaml'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /admin/users/{userId}/suspend:
    post:
      tags:
        - Admin
      summary: Suspend a user account
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User suspended
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
