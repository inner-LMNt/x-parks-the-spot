name: Backend Tests
on: push

jobs:
  container-job:
    runs-on: ubuntu-latest
    container: python:3-bookworm

    services:
      redis:
        image: redis
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip3 install -r backend/requirements.txt

      - name: mypy
        run: "cd backend && mypy app --strict"

      - name: Check Formatting
        run: "cd backend && black app --check"

      - name: Run Tests
        run: "cd backend && pytest"
        env:
          TEST_DATABASE_URI: "user=postgres password=postgres host=postgres port=5432"
          DATABASE_URI: "unused"
          TEST_DATABASE_NAME: test_xpark
          REDIS_URI: "redis://redis?db=0"
          SECRET_KEY: test_key
