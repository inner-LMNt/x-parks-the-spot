name: Node.js CI

on:
  push:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/node.js.yml"]
  pull_request:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/node.js.yml"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      # - name: Prettify code
      #   uses: creyD/prettier_action@v4.3
      #   with:
      #     dry: True
      #     prettier_options: "--check frontend/**/*.{js,jsx,ts,tsx,html,md,css,scss}"
      - name: Build
        working-directory: ./frontend
        run: npm run build --if-present
      - name: Test
        working-directory: ./frontend
        run: |
          npm run test:coverage | tail -n +6 | sed '$d' > coverage.md
          sed -i '2,$ s/^/| /; 2,$ s/$/ |/' coverage.md
      - name: "Report Code Coverage"
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: frontend/coverage.md
          comment_tag: coverage_frontend
          mode: recreate
